# Supabase pauses free-plan projects after about a week of low database
# activity, which takes TRACE offline between exercises. This sends a small
# read to the database every day so that never happens.
#
# It uses the same public (publishable) key as the app, and the database's
# access rules return no rows to it, so it reads nothing. Paid Supabase
# plans never pause; delete this file if you upgrade.
#
# GitHub turns off scheduled workflows after 60 days with no commits to the
# repository. If that happens, re-enable it under Actions > Keep Supabase awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the TRACE database
        run: |
          url=$(grep -oE 'supabaseUrl: *"[^"]+"' js/shared/config.js | cut -d'"' -f2)
          key=$(grep -oE 'supabaseAnonKey: *"[^"]+"' js/shared/config.js | cut -d'"' -f2)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "TRACE is in local-only mode; nothing to keep awake."
            exit 0
          fi
          for table in units events evaluations; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              "$url/rest/v1/$table?select=id&limit=1" \
              -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "$table: HTTP $code"
          done
          [ "$code" -lt 500 ]
